<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your WhamBam password</title>
</head>
<body style="margin:0;padding:0;background:#0A0500;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0A0500;padding:40px 16px">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#1a1400;border-radius:20px;border:1.5px solid rgba(255,214,10,.25);overflow:hidden">
          <!-- Header -->
          <tr>
            <td style="padding:32px 32px 16px;text-align:center">
              <div style="font-size:42px;margin-bottom:8px">🔐</div>
              <h1 style="margin:0;font-size:22px;font-weight:900;color:#FFD60A">Reset Your Password</h1>
              <p style="margin:8px 0 0;font-size:14px;color:#a89a7b">Someone requested a password reset for your account</p>
            </td>
          </tr>
          <!-- OTP Code -->
          <tr>
            <td style="padding:8px 32px 24px;text-align:center">
              <p style="margin:0 0 12px;font-size:13px;color:#a89a7b">Enter this code in the app:</p>
              <div style="background:#0A0500;border:2px solid rgba(255,214,10,.4);border-radius:14px;padding:18px 24px;display:inline-block;-webkit-user-select:all;user-select:all;cursor:pointer">
                <span style="font-size:36px;font-weight:900;letter-spacing:10px;color:#FFD60A;font-family:'Courier New',monospace;-webkit-user-select:all;user-select:all">{{ .Token }}</span>
              </div>
              <p style="margin:10px 0 0;font-size:11px;font-weight:700;color:#FFD60A">📋 Tap the code to select &amp; copy</p>
              <p style="margin:8px 0 0;font-size:12px;color:#6b5f47">This code expires in 10 minutes</p>
            </td>
          </tr>
          <!-- Spacer -->
          <tr>
            <td style="padding:0 32px 16px"></td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:16px 32px 24px;text-align:center;border-top:1px solid rgba(255,214,10,.08)">
              <p style="margin:0;font-size:11px;color:#4a4030">If you didn't request a password reset, you can safely ignore this email. Your password will not change.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
