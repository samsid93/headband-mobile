# Wham Bam — Supabase config (auth-focused)
# Pushed to the hosted project with:  supabase config push
#
# WARNING: `config push` is DECLARATIVE. It makes the remote [auth] config
# match THIS file. Review the diff it prints and confirm before applying.
# Secrets are read from environment variables (env(...)), never hard-coded here.

project_id = "izxzlxtowubbjiatouci"

[auth]
# Base URL of the site, used for redirects and email links
site_url = "https://whambam.games"
# Extra URLs the OAuth / magic-link flow is allowed to return to
additional_redirect_urls = [
  "https://whambam.games",
  "https://whambam.games/",
  "https://whambam.games/*"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Require users to click the confirmation link before they can sign in
enable_confirmations = true
# Keep sign-in secure on email change
secure_email_change_enabled = true
# Sign-in code (the app's "Email me a sign-in code" flow). The mail carries both
# a link and {{ .Token }}; the app asks for the 6 digits so the player never has
# to leave it. GoTrue's default send rate is one mail per minute per address —
# the in-app "Send a new code" button matches that with a 60s cooldown.
otp_length = 6
otp_expiry = 3600

# ---- Branded "Confirm signup" email ----
[auth.email.template.confirmation]
subject = "Confirm your Wham Bam account 🎉"
content_path = "./templates/confirmation.html"

# ---- Sign-in code email. MUST contain {{ .Token }} — the app's code-entry
#      screen has nothing to type without it. ----
[auth.email.template.magic_link]
subject = "Your Wham Bam sign-in code 🔐"
content_path = "./templates/magic_link.html"

# ---- (Optional) brand the recovery mail too — templates/recovery.html already
#      exists, this only needs uncommenting. ----
# [auth.email.template.recovery]
# subject = "Reset your Wham Bam password"
# content_path = "./templates/recovery.html"

# ---- (Optional) Custom SMTP = full de-brand (sender becomes your domain).
#      Fill host/port/user from your provider (Resend/Postmark/SES/...),
#      set the password as an env var, then uncomment. ----
# [auth.email.smtp]
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(SMTP_PASSWORD)"
# admin_email = "no-reply@whambam.games"
# sender_name = "Wham Bam"

# ---- Google OAuth (Supabase side). The Google Cloud Console side
#      (redirect URI + publishing the consent screen) must still be done
#      manually — see the runbook. ----
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# (Do NOT set redirect_uri here — Supabase uses its own fixed callback.)
# The callback Google must allow (paste into Google's "Authorized redirect
# URIs"): https://izxzlxtowubbjiatouci.supabase.co/auth/v1/callback
