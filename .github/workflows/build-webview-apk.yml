name: Build WebView APK (HeadBand)

on:
  push:
    branches: [main]
    paths:
      - 'capacitor-app/**'
      - '.github/workflows/build-webview-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android WebView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install npm deps
        working-directory: capacitor-app
        run: npm ci

      - name: Sync Capacitor
        working-directory: capacitor-app
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x capacitor-app/android/gradlew

      - name: Build Debug APK
        working-directory: capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: headband-webview-debug
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
