name: Build iOS (Wham Bam)

# iOS can only be compiled on macOS — xcodebuild does not exist on Linux or
# Windows, so this workflow is the project's only route to a verified iOS
# build.
#
# There is deliberately NO conditional skip here. An earlier version gated the
# signed build behind a secrets-detection job, which meant a missing secret and
# a bug in the detection logic produced the identical, uninformative outcome:
# "skipped". Four rounds were lost to that ambiguity. The build now always
# runs and fails loudly with a named cause instead.
#
# Required secrets (repo Settings -> Secrets and variables -> ACTIONS tab,
# "New repository secret" — not Variables, not Codespaces, not Dependabot,
# not environment-scoped):
#   APPLE_TEAM_ID                 10-char Team ID, developer.apple.com/account
#   APP_STORE_CONNECT_KEY_ID      from an App Store Connect API key
#   APP_STORE_CONNECT_ISSUER_ID   from an App Store Connect API key
#   APP_STORE_CONNECT_KEY_P8      full contents of that key's .p8 file

on:
  push:
    branches: [main]
    paths:
      - 'capacitor-app/**'
      - 'headband-game-web.html'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & upload to TestFlight
    runs-on: macos-15
    # macOS runners bill at 10x the Linux rate. Signing is the step most likely
    # to hang (it can sit waiting on a provisioning decision that never comes),
    # so cap it rather than let a stuck run drain the minutes budget.
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fails the run immediately, naming exactly which secrets are unreadable,
      # rather than letting the job proceed and die deep inside Fastlane with a
      # less obvious message.
      - name: Verify Apple signing secrets are readable
        run: |
          echo "repository: $GITHUB_REPOSITORY"
          echo "event:      $GITHUB_EVENT_NAME"
          echo "ref:        $GITHUB_REF"
          echo "APPLE_TEAM_ID                len=${#APPLE_TEAM_ID}"
          echo "APP_STORE_CONNECT_KEY_ID     len=${#APP_STORE_CONNECT_KEY_ID}"
          echo "APP_STORE_CONNECT_ISSUER_ID  len=${#APP_STORE_CONNECT_ISSUER_ID}"
          echo "APP_STORE_CONNECT_KEY_P8     len=${#APP_STORE_CONNECT_KEY_P8}"

          MISSING=""
          [ -z "$APPLE_TEAM_ID" ]               && MISSING="$MISSING APPLE_TEAM_ID"
          [ -z "$APP_STORE_CONNECT_KEY_ID" ]    && MISSING="$MISSING APP_STORE_CONNECT_KEY_ID"
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$APP_STORE_CONNECT_KEY_P8" ]    && MISSING="$MISSING APP_STORE_CONNECT_KEY_P8"

          if [ -n "$MISSING" ]; then
            echo ""
            echo "::error::Unreadable secrets:$MISSING"
            echo "Repository shown above is where this workflow ran. Secrets must"
            echo "exist on THAT repo, under Settings -> Secrets and variables ->"
            echo "Actions -> 'New repository secret'."
            exit 1
          fi
          echo "All four Apple secrets readable."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Install npm deps
        working-directory: capacitor-app
        run: npm ci

      # Regenerates ios/App/CapApp-SPM/Package.swift natively. The committed
      # copy carries Windows-style backslash paths (generated by `cap sync` on
      # Windows) which Swift Package Manager cannot resolve on macOS — this
      # step is what makes that self-healing, so it must run before any build.
      - name: Sync web assets into the native project
        working-directory: capacitor-app
        run: npm run sync:ios

      - name: Fail if the bundled web app is missing
        working-directory: capacitor-app
        run: test -s ios/App/App/public/index.html || (echo "public/index.html missing" && exit 1)

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Build and upload to TestFlight
        working-directory: capacitor-app/ios/App
        run: fastlane beta

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whambam-ios-fastlane-logs
          path: |
            ~/Library/Logs/gym/**
            capacitor-app/ios/App/build/**/*.log
          retention-days: 14
          if-no-files-found: ignore
