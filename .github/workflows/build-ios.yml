name: Build iOS (Wham Bam)

# iOS can only be compiled on macOS — xcodebuild does not exist on Linux or
# Windows, so this workflow is the project's only route to a verified iOS
# build.
#
# Two mutually exclusive jobs:
#   - build-signed: runs once the 4 Apple secrets below exist. Archives,
#     signs (Xcode creates the distribution cert + provisioning profile
#     itself via the App Store Connect API key — no fastlane match, no
#     separate certs repo) and uploads straight to TestFlight.
#   - build-unsigned: fallback compile-only check for when those secrets are
#     absent. A successful signed build is a strict superset of this, so
#     there is no value running both once signing works.
#
# Required secrets (repo Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID                 10-char Team ID, developer.apple.com/account
#   APP_STORE_CONNECT_KEY_ID      from an App Store Connect API key
#   APP_STORE_CONNECT_ISSUER_ID   from an App Store Connect API key
#   APP_STORE_CONNECT_KEY_P8      full contents of that key's .p8 file

on:
  push:
    branches: [main]
    paths:
      - 'capacitor-app/**'
      - 'headband-game-web.html'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  # The `secrets` context cannot be referenced in a job-level `if:` at all —
  # unlike step-level `if:` / `env:`, GitHub rejects the whole workflow file
  # as invalid if it's tried (this is what happened on the first attempt:
  # zero jobs ever scheduled). A job's OUTPUT is fair game in a downstream
  # job's `if:` though, so a tiny detection job is the standard workaround.
  detect:
    name: Check for Apple signing secrets
    runs-on: ubuntu-latest
    outputs:
      has_apple_secrets: ${{ steps.check.outputs.result }}
    steps:
      # Secrets are passed via env:, NOT interpolated into the script body.
      # APP_STORE_CONNECT_KEY_P8 is multi-line (a PEM block); splicing that
      # straight into `if [ -n "${{ ... }}" ]` pastes raw newlines into the
      # expression, which is exactly the sort of thing that silently misreads.
      # env: hands the value over intact regardless of newlines.
      - id: check
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          V_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          V_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          V_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          V_KEY_P8: ${{ vars.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          # Report presence and length only — never the values. GitHub masks
          # secret values in logs anyway, but lengths are enough to tell a
          # missing secret from a truncated or mis-pasted one.
          echo "repository: $GITHUB_REPOSITORY"
          echo "--- as SECRETS (what this workflow uses) ---"
          echo "APPLE_TEAM_ID                len=${#TEAM_ID}"
          echo "APP_STORE_CONNECT_KEY_ID     len=${#KEY_ID}"
          echo "APP_STORE_CONNECT_ISSUER_ID  len=${#ISSUER_ID}"
          echo "APP_STORE_CONNECT_KEY_P8     len=${#KEY_P8}"
          # If all four secrets are empty, the usual cause is that they were
          # saved on the "Variables" tab rather than "Secrets" — the two sit
          # side by side and look nearly identical. Checking vars.* tells the
          # two cases apart in one run instead of another round of guessing.
          echo "--- as VARIABLES (wrong tab, if these are non-zero) ---"
          echo "APPLE_TEAM_ID                len=${#V_TEAM_ID}"
          echo "APP_STORE_CONNECT_KEY_ID     len=${#V_KEY_ID}"
          echo "APP_STORE_CONNECT_ISSUER_ID  len=${#V_ISSUER_ID}"
          echo "APP_STORE_CONNECT_KEY_P8     len=${#V_KEY_P8}"

          MISSING=""
          [ -z "$TEAM_ID" ]   && MISSING="$MISSING APPLE_TEAM_ID"
          [ -z "$KEY_ID" ]    && MISSING="$MISSING APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ] && MISSING="$MISSING APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$KEY_P8" ]    && MISSING="$MISSING APP_STORE_CONNECT_KEY_P8"

          if [ -n "$MISSING" ]; then
            echo "::warning::Signed build skipped. Missing or empty secrets:$MISSING"
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "All four Apple secrets present."
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

  build-signed:
    name: Build & upload to TestFlight
    needs: detect
    if: needs.detect.outputs.has_apple_secrets == 'true'
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Install npm deps
        working-directory: capacitor-app
        run: npm ci

      - name: Sync web assets into the native project
        working-directory: capacitor-app
        run: npm run sync:ios

      - name: Fail if the bundled web app is missing
        working-directory: capacitor-app
        run: test -s ios/App/App/public/index.html || (echo "public/index.html missing" && exit 1)

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Fastlane
        run: gem install fastlane -N

      - name: Build and upload to TestFlight
        working-directory: capacitor-app/ios/App
        run: fastlane beta

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whambam-ios-fastlane-logs
          path: ~/Library/Logs/gym/**
          retention-days: 14
          if-no-files-found: ignore

  build-unsigned:
    name: Compile iOS (unsigned)
    needs: detect
    if: needs.detect.outputs.has_apple_secrets == 'false'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Install npm deps
        working-directory: capacitor-app
        run: npm ci

      - name: Sync web assets into the native project
        working-directory: capacitor-app
        run: npm run sync:ios

      - name: Fail if the bundled web app is missing
        working-directory: capacitor-app
        run: test -s ios/App/App/public/index.html || (echo "public/index.html missing" && exit 1)

      - name: Show Xcode version
        run: xcodebuild -version

      # Capacitor 8 uses Swift Package Manager, not CocoaPods, so there is no
      # .xcworkspace and no `pod install` step — the .xcodeproj builds directly.
      - name: Build (no code signing)
        working-directory: capacitor-app/ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: whambam-ios-unsigned-app
          path: capacitor-app/ios/App/build/Build/Products/Release-iphoneos/App.app
          retention-days: 30
