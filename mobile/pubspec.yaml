name: headband_mobile
description: A native mobile port of the HeadBand! party game.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  sensors_plus: ^6.1.1
  speech_to_text: ^7.3.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  permission_handler: ^11.3.1
  vibration_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
